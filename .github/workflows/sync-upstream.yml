name: Auto Sync Upstream
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Get upstream info
        id: upstream
        uses: actions/github-script@v7
        with:
          script: |
            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const parent = repo.data.parent;
            if (!parent) {
              console.log('No parent repo, skipping.');
              return;
            }
            console.log('parent: ' + parent.full_name);
            core.setOutput('parent_full_name', parent.full_name);
      - name: Sync upstream
        if: steps.upstream.outputs.parent_full_name
        run: |
          git remote add upstream https://github.com/${{ steps.upstream.outputs.parent_full_name }}.git
          git fetch upstream
          git checkout ${{ github.head_ref || github.ref_name }}
          git merge upstream/$(basename ${{ github.head_ref || github.ref_name }} -- - 2>/dev/null || echo master) --no-edit || \
          git merge upstream/master --no-edit || \
          git merge upstream/main --no-edit
          git push origin ${{ github.head_ref || github.ref_name }}
